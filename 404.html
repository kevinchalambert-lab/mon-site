<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <style>
    .nf { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 28px; gap: 28px; }
    .nf-label { font-size: .6rem; font-weight: 200; letter-spacing: .42em; text-transform: uppercase; color: rgba(255,255,255,.35); }
    .nf-title { font-family: var(--serif); font-weight: 300; font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.1; color: #fff; }
    .nf-title em { font-style: italic; opacity: .7; }
    .nf-links { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
    .nf-links a { font-size: .66rem; font-weight: 300; letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.2); padding: 14px 26px; transition: background .5s, color .5s; }
    .nf-links a:hover { background: var(--cream); color: var(--ink); }
  </style>
</head>
<body>
  <main class="nf">
    <span class="nf-label">Erreur 404</span>
    <h1 class="nf-title">Cette page est <em>introuvable.</em></h1>
    <div class="nf-links">
      <a href="/">Accueil</a>
      <a href="/blog">Le Journal</a>
      <a href="/contact">Demande privée</a>
    </div>
  </main>
</body>
